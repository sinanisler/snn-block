<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>react-colorful on React 18.3.1</title>
<style>
body{margin:0;padding:16px;background:#eeeeea;font:12px/1.35 "Segoe UI",system-ui,sans-serif;color:#1c1c1a}
.card{width:260px;background:#fff;border:1px solid #e2e2dd;border-radius:10px;padding:12px}
.note{margin-top:10px;color:#6b6b65}
.react-colorful{width:100%;height:160px}
</style>
</head>
<body>
<div class="card" id="root">Loading react-colorful…</div>
<script type="module">
// Test render only: react-colorful 5.8.1 (MIT) on React 18.3.1, the version WordPress 7.1 ships for the block editor.
import React from "https://esm.sh/react@18.3.1";
import ReactDOM from "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1";
import { HexColorPicker } from "https://esm.sh/react-colorful@5.8.1?deps=react@18.3.1,react-dom@18.3.1";
const h = React.createElement;
function App() {
  const [color, setColor] = React.useState("#2b6be6");
  return h("div", null,
    h(HexColorPicker, { color: color, onChange: setColor }),
    h("div", { className: "note" }, "Hex value: " + color)
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
